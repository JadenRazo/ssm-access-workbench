<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SSM Access Workbench</title>
  <desc id="desc">A Windows and AWS access toolkit. Familiar SSH, a scoped AWS access path. Three stages: identity, route, and host.</desc>
  <rect width="1200" height="360" rx="18" fill="#101d2d"/>
  <path d="M0 335H1200" stroke="#273749"/>
  <path d="M48 54h22v22H48z" fill="none" stroke="#8de4c4" stroke-width="3"/>
  <path d="m56 65 5 5 12-15" fill="none" stroke="#8de4c4" stroke-width="3"/>
  <text x="90" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3" fill="#c3d0dd">WINDOWS / AWS / SSH</text>
  <text x="48" y="165" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#f6f8fa">SSM Access</text>
  <text x="48" y="248" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#f6f8fa">Workbench</text>
  <text x="51" y="299" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#c3d0dd">Familiar SSH. A scoped AWS access path.</text>
  <path d="M811 73v213" stroke="#486177" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="811" cy="83" r="9" fill="#8de4c4"/>
    <text x="843" y="91" font-size="25" font-weight="700" fill="#f6f8fa">Identity</text>
    <text x="843" y="121" font-size="20" fill="#b7c7d6">SSO + MFA</text>
    <circle cx="811" cy="178" r="9" fill="#8de4c4"/>
    <text x="843" y="186" font-size="25" font-weight="700" fill="#f6f8fa">Route</text>
    <text x="843" y="216" font-size="20" fill="#b7c7d6">Scoped SSM tunnel</text>
    <circle cx="811" cy="273" r="9" fill="#8de4c4"/>
    <text x="843" y="281" font-size="25" font-weight="700" fill="#f6f8fa">Host</text>
    <text x="843" y="311" font-size="20" fill="#b7c7d6">Linux + SSH key</text>
  </g>
</svg>
